
<!doctype html>
<html lang="ja" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="気象ウォッチ">
<meta name="color-scheme" content="light dark">
<title>気象ウォッチ</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#131e30;--sub:#1a2940;--line:#2b3a50;--text:#edf4ff;--muted:#a5b4ca;--blue:#66c7ff}
:root[data-theme="light"]{color-scheme:light;--bg:#f2f6fb;--panel:#fff;--sub:#eaf1f9;--line:#d5dfeb;--text:#17263b;--muted:#5d6d82;--blue:#087db8}
@media(prefers-color-scheme:light){:root[data-theme="system"]{color-scheme:light;--bg:#f2f6fb;--panel:#fff;--sub:#eaf1f9;--line:#d5dfeb;--text:#17263b;--muted:#5d6d82;--blue:#087db8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.55}
main{max-width:760px;margin:auto;padding:24px 16px}
header,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
header{align-items:flex-start;margin-bottom:18px}
h1{font-size:26px;margin:0}
h2{font-size:17px;margin:0 0 12px}
p,.muted{font-size:13px;color:var(--muted)}
.themes{display:flex;gap:4px;background:var(--sub);padding:4px;border-radius:12px}
button{border:1px solid var(--line);border-radius:9px;background:var(--sub);color:var(--text);padding:8px;font-size:12px}
.themes button{border:0;background:transparent;color:var(--muted)}
.themes button[aria-pressed=true]{background:var(--panel);color:var(--text)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
a.link{display:block;text-decoration:none;color:var(--text);background:var(--sub);border:1px solid var(--line);border-radius:12px;padding:13px}
.link strong,.link span{display:block}
.link strong{font-size:14px}
.link span{font-size:12px;color:var(--muted);margin-top:5px}
.quake{border-top:1px solid var(--line);padding:10px 0}
.quake small{display:block;color:var(--muted)}
@media(max-width:420px){header{display:block}.themes{width:max-content;margin-top:8px}.grid{gap:8px}.link{padding:10px!important}}
</style>
</head>
<body>
<main>
<header>
<div><p>WEATHER · EARTHQUAKE</p><h1>🌦️ 気象ウォッチ</h1><p>気象・地震情報をすばやく確認</p></div>
<div><p>表示テーマ</p><div class="themes">
<button data-mode="system" aria-pressed="true">端末設定</button>
<button data-mode="light" aria-pressed="false">ライト</button>
<button data-mode="dark" aria-pressed="false">ダーク</button>
</div></div>
</header>
<section class="panel">
<h2>🌤️ 気象情報</h2>
<div class="grid">
<a class="link" href="https://www.jma.go.jp/bosai/warning/" target="_blank" rel="noopener"><strong>⚠️ 気象警報・注意報</strong><span>大雨・暴風・大雪など ↗</span></a>
<a class="link" href="https://www.jma.go.jp/bosai/nowc/" target="_blank" rel="noopener"><strong>🌧️ 雨雲レーダー</strong><span>雨雲の動きを確認 ↗</span></a>
<a class="link" href="https://www.jma.go.jp/bosai/map.html#contents=earthquake_map" target="_blank" rel="noopener"><strong>🌏 地震情報</strong><span>震源・震度など ↗</span></a>
<a class="link" href="https://www.jma.go.jp/bosai/map.html#contents=tsunami" target="_blank" rel="noopener"><strong>🌊 津波情報</strong><span>津波警報・注意報 ↗</span></a>
</div>
</section>
<section class="panel">
<div class="row"><h2>🫨 最近の地震</h2><button id="refresh">↻ 更新</button></div>
<div id="quakes" class="muted">読み込み中…</div>
<p id="updated"></p>
</section>
<section class="panel">
<h2>📌 利用上の注意</h2>
<p>このアプリは情報確認用です。緊急地震速報や避難指示を通知するものではありません。災害時は気象庁・自治体などの公式発表を確認し、安全を最優先にしてください。</p>
</section>
<p style="text-align:center">気象ウォッチ · 情報確認用</p>
</main>
<script>
(()=>{
const root=document.documentElement;
const buttons=document.querySelectorAll('[data-mode]');
let mode='system';
try{mode=localStorage.getItem('kisho-theme')||'system'}catch(e){}
function setMode(m){
mode=m;root.dataset.theme=m;
buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));
try{localStorage.setItem('kisho-theme',m)}catch(e){}
}
buttons.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
setMode(mode);
const list=document.getElementById('quakes');
const updated=document.getElementById('updated');
const refresh=document.getElementById('refresh');
function fmt(t){
if(!t)return '時刻不明';
const d=new Date(t);
return isNaN(d)?'時刻不明':d.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
async function load(){
refresh.disabled=true;refresh.textContent='取得中…';
try{
const r=await fetch('https://api.p2pquake.net/v2/history?codes=551&limit=10',{cache:'no-store'});
if(!r.ok)throw Error();
const data=await r.json();
list.replaceChildren();
if(!data.length){list.textContent='表示できる地震情報がありません。';}
data.forEach(item=>{
const q=item.earthquake||{};
const el=document.createElement('div');el.className='quake';
const title=document.createElement('strong');
title.textContent=q.hypocenter?.name||'震源情報なし';
const small=document.createElement('small');
const scales={10:'震度1',20:'震度2',30:'震度3',40:'震度4',45:'震度5弱',50:'震度5強',55:'震度6弱',60:'震度6強',70:'震度7'};
small.textContent=fmt(q.time)+' · '+(scales[q.maxScale]||'震度情報');
el.append(title,small);list.append(el);
});
updated.textContent='最終取得：'+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
}catch(e){list.textContent='取得できませんでした。通信を確認するか、公式の地震情報をご覧ください。';updated.textContent='';}
finally{refresh.disabled=false;refresh.textContent='↻ 更新';}
}
refresh.addEventListener('click',load);
load();setInterval(load,60000);
})();
</script>
</body>
</html>
